name: Playwright
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shrink
          POSTGRES_PASSWORD: shrink
          POSTGRES_DB: shrink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shrink -d shrink_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://shrink:shrink@127.0.0.1:5432/shrink_test
      DATABASE_URL: postgresql://shrink:shrink@127.0.0.1:5432/shrink_test
      DIRECT_URL: postgresql://shrink:shrink@127.0.0.1:5432/shrink_test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:deploy
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results
